# tomcat
server:
  port: ${app.port:8080}

# spring相关
spring:
  application:
    name: ${app.name}
  profiles:
    active: ${profile:dev}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${db.ip}:${db.port}/${db.database}?autoReconnect=true&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true
    username: ${db.username}
    password: ${db.password}
    druid:
      initial-size: ${db.initial-size}
      min-idle: ${db.min-idle}
      max-active: ${db.max-active}
      max-wait: ${db.max-wait}
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 200
      max-open-prepared-statements: 20
      validation-query: select 1
      validation-query-timeout: 6000
      test-on-borrow: true
      test-on-return: false
      test-while-idle: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      filters: stat
  ai:
    openai:
      api-key: ${deepseek_api_Key}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-v4-flash
        temperature: 0.3
        max-tokens: 4096
        extra-body:
          thinking.type: disabled
    chat:
      memory:
        redis:
          host: ${redis.host:localhost}
          port: ${redis.port:6379}
          key-prefix: "zsagent:chat:memory:"
          time-to-live: 30m
          initialize-schema: true
    vectorstore:
      elasticsearch:
        initialize-schema: false
        index-name: zsagent_knowledge
        dimensions: 1024
        similarity: cosine
        embedding-field-name: embedding
  elasticsearch:
    uris: ${es.uri:http://localhost:9200}
    username: ${es.username:}
    password: ${es.password:}
  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}
      password: ${redis.password:}

# mybatis
mybatis:
  mapper-locations: classpath:mapper/**/*Mapper.xml
  type-aliases-package: com.lazycece.zsagent.infra.dal
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# 项目自定义配置
zsagent:
  storage:
    local-file-base-dir: ${ZSAGENT_STORAGE_DIR:./storage/files/}